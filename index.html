<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/icon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kâtip</title>
    <script>
      // Tema Vue yüklenmeden uygulanır; açık tema kullanan makinelerde ilk karede
      // koyu arka plan/logo gölgesi parlaması oluşmaz.
      try {
        const tema = localStorage.getItem('uygulamaTema') || 'dark'
        document.documentElement.setAttribute('data-theme', tema)
        document.documentElement.style.colorScheme = tema
        if (tema === 'dark') document.documentElement.classList.add('p-dark')
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
