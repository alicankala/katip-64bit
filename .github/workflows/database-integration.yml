name: Full verification

on:
  push:
    branches:
      - master
      - 'test/**'
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:release-contract
      - run: npx vue-tsc --noEmit
      - run: npm run test:unit
      # Compile source only; do not create installers on branch pushes.
      - run: npx vite build
      - run: npm run test:integration
      - run: npm run test:business
      - run: npm run test:stage4
      # Smoke testi normal build çıktısını, gerçek Electron/preload ve yalnız
      # doğrulanmış geçici userData + SQLite ile kullanır.
      - run: npm run test:smoke
